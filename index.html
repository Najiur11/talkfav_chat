<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'light')}catch(e){}</script>
    <link rel="stylesheet" href="assets/Css/theme.css">
    <link rel="stylesheet" href="assets/Css/login.css">
    

    <title>Page Title</title>
</head>
<body>
    
    <button id="theme-toggle" type="button" aria-label="Toggle dark mode">
    <span id="theme-icon">🌙</span>
    </button>

    <div class="login-page">

     <section class="brand-panel">
     <img src="assets/images/logo-light.png" alt="TalkFav" class="brand-logo logo-light">
     <img src="assets/images/logo-dark.png"  alt="TalkFav" class="brand-logo logo-dark">
     <h1>Welcome <span class="gradient-text">Back!</span></h1>
     <p class="brand-sub">Log in to connect, chat and collaborate with <strong>TalkFav</strong> community.</p>
     <div class="feature-chips">
        <div class="chip"><span>⚡</span> Fast &amp; Reliable</div>
        <div class="chip"><span>🛡️</span> Secure &amp; Private</div>
        <div class="chip"><span>👥</span> Team Friendly</div>
    </div>
       </section>


<div class="login-container">



    <div class="avatar-ring">
        <div class="avatar-in">
            <svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true">
                <defs>
                    <linearGradient id="avGrad" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0" stop-color="#00c6ff"/><stop offset="1" stop-color="#c026d3"/>
                    </linearGradient>
                </defs>
                <circle cx="12" cy="8" r="4.2" fill="url(#avGrad)"/>
                <path d="M3.5 21c0-4.6 3.8-7.5 8.5-7.5s8.5 2.9 8.5 7.5z" fill="url(#avGrad)"/>
            </svg>
        </div>
    </div>

    <h2>Login to <span class="gradient-text">TalkFav</span></h2>
    <p class="form-sub">Enter your email and password to continue</p>

    <form id="loginForm" action="#" method="POST">

        <div class="input-group">
            <label for="email" class="sr-only">Email address</label>
            <div class="field">
                <svg class="field-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 7 8.5 6.5L20.5 7"/>
                </svg>
                <input type="email" id="email" name="email" placeholder="Email Address" required>
            </div>
        </div>

        <div class="input-group">
            <label for="password" class="sr-only">Password</label>
            <div class="field">
                <svg class="field-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/><circle cx="12" cy="15.5" r="1.2" fill="currentColor"/>
                </svg>
                <input type="password" id="password" name="password" placeholder="Password" required>
                <span id="toggle-password" class="eye-icon">👁️</span>
            </div>
        </div>

        <div class="options">
            <label>
                <input type="checkbox" name="remember">Remember me
            </label>
            <a href="#">Forgot password?</a>
        </div>

        <button type="submit" class="btn-primary btn-submit">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M10 8l4 4-4 4"/><path d="M14 12H4"/>
            </svg>
            Log In
        </button>
    </form>

    <div id="thankYouMessage" style="display: none; text-align: center; margin-top: 20px;">
        <h2>Thank you for logging in!</h2>
    </div>

    <div class="divider"><span>or</span></div>

    <div class="social-row">
        <button type="button" class="social-btn" aria-label="Google" title="Coming soon">
            <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="#4285F4" d="M23.5 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.45a5.5 5.5 0 0 1-2.39 3.62v3h3.87c2.27-2.09 3.57-5.17 3.57-8.81z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.94-2.91l-3.87-3c-1.07.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.96H1.27v3.09A12 12 0 0 0 12 24z"/>
                <path fill="#FBBC05" d="M5.27 14.28A7.2 7.2 0 0 1 4.9 12c0-.79.14-1.56.37-2.28V6.63H1.27A12 12 0 0 0 0 12c0 1.94.46 3.77 1.27 5.37l4-3.09z"/>
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0A12 12 0 0 0 1.27 6.63l4 3.09C6.22 6.86 8.87 4.75 12 4.75z"/>
            </svg>
        </button>
        <button type="button" class="social-btn" aria-label="Facebook" title="Coming soon">
            <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="12" fill="#1877F2"/>
                <path fill="#fff" d="M16.67 15.47 17.2 12h-3.33V9.75c0-.95.46-1.88 1.96-1.88h1.51V4.92s-1.37-.23-2.69-.23c-2.74 0-4.53 1.66-4.53 4.67V12H7.08v3.47h3.04V24h3.75v-8.53z"/>
            </svg>
        </button>
        <button type="button" class="social-btn" aria-label="Telegram" title="Coming soon">
            <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="#29A9EB" d="M21.5 3.5 2.6 10.8c-.9.35-.9 1.6 0 1.9l4.6 1.5 1.8 5.6c.2.7 1.1.9 1.6.4l2.5-2.4 4.7 3.5c.6.4 1.4.1 1.6-.6L22.9 4.8c.2-.8-.6-1.5-1.4-1.3z"/>
                <path fill="#fff" opacity=".9" d="m9.2 14.2 8.6-6.4-6.7 7.3-.4 3.2z"/>
            </svg>
        </button>
    </div>

    <p class="signup-text">Don't have an account?<a href="register.html">Sign Up</a></p>

</div>

</div>
<script src="assets/js/script.js"></script>
</body>
</html>
