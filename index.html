<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — TalkFav</title>
<meta name="description" content="TalkFav: chat, group chat, audio and video calls and file sharing in one free app.">
<meta name="theme-color" content="#0E8F5B">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/assets/icons/favicon.png">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TalkFav">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<script>
  /* theme (app er sathe eki) - page aankar agei */
  (function () {
    var t = localStorage.getItem('theme');
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="stylesheet" href="/assets/Css/auth.css">
</head>
<body>
<!-- pichoner alo + pata -->
<div class="bg" aria-hidden="true">
  <span class="glow glow-a"></span><span class="glow glow-b"></span>
  <svg width="0" height="0" style="position:absolute"><defs>
    <symbol id="leafA" viewBox="0 0 100 160"><path d="M50 156C50 120 14 104 10 64 6 26 34 6 50 2c16 4 44 24 40 62-4 40-40 56-40 92z"/><path d="M50 156V20M50 60 28 40M50 82 24 62M50 104 30 88M50 60l22-20M50 82l26-20M50 104l20-16"/></symbol>
    <symbol id="leafB" viewBox="0 0 100 160"><path d="M50 158c-6-30-40-46-42-86C6 38 26 10 50 2c24 8 44 36 42 70-2 40-36 56-42 86z"/><path d="M50 158C48 110 52 60 50 14"/></symbol>
  </defs></svg>
  <svg class="leaf leaf-1"><use href="#leafA"/></svg><svg class="leaf leaf-2"><use href="#leafB"/></svg>
  <svg class="leaf leaf-3"><use href="#leafA"/></svg><svg class="leaf leaf-4"><use href="#leafB"/></svg>
</div>

<div class="topbar">
  <a class="back-link" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg><span>Back to home</span></a>
  <button id="theme-toggle" class="theme-btn" type="button" aria-label="Switch dark or light mode"><svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg></button>
</div>

<main class="auth-page">
  <section class="brand-panel">
    <a class="brand" href="/" aria-label="TalkFav home"><svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="tfLogo" x1="2" y1="3" x2="22" y2="21" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0E8F5B"/><stop offset=".5" stop-color="#12B07A"/><stop offset="1" stop-color="#0D9C94"/></linearGradient></defs><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-4-1L3 20l1.2-4.4A8.4 8.4 0 1 1 21 11.5z" fill="none" stroke="url(#tfLogo)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.5 11.2c0-1.3 1-2.2 2.1-2.2.8 0 1.4.4 1.4.4s.6-.4 1.4-.4c1.2 0 2.1.9 2.1 2.2 0 2-3.5 4-3.5 4s-3.5-2-3.5-4z" fill="url(#tfLogo)"/></svg>TalkFav</a>
    <span class="greet" id="greet">Hello</span>
    <h1>Welcome <span class="gradient-text">Back!</span></h1>
    <p class="brand-sub">Log in to connect, chat and collaborate with the <strong>TalkFav</strong> community.</p>
      <div class="feature-chips">
        <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>Fast &amp; Reliable</div>
        <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 5 3.4 8.4 8 9 4.6-.6 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/></svg>Secure &amp; Private</div>
        <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2.2.6 3.5 2.6 3.5 6"/></svg>Team Friendly</div>
      </div>
  </section>

  <div class="auth-card" id="authCard">
    <div class="avatar-ring"><div class="avatar-in" id="avatarIn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4.2" fill="currentColor"/><path d="M3.5 21c0-4.6 3.8-7.5 8.5-7.5s8.5 2.9 8.5 7.5z" fill="currentColor"/></svg>
      </div></div>
    <h2 id="cardTitle">Log in to <span class="gradient-text">TalkFav</span></h2>
    <p class="form-sub" id="formSub">Enter your email and password to continue</p>
    <span class="not-you" id="notYou" hidden>Not you? <button type="button" id="notYouBtn">Use another account</button></span>

    <form id="loginForm" novalidate>
      <div class="form-alert" id="formAlert" role="alert" hidden></div>
      <div class="input-group">
        <div class="field">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 7 8.5 6.5L20.5 7"/></svg>
          <input type="email" id="email" name="email" placeholder=" " autocomplete="email" required>
          <label class="float-label" for="email">Email address</label>
        </div>
        <span class="field-error" id="emailError" aria-live="polite"></span>
      </div>
      <div class="input-group">
        <div class="field">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/><circle cx="12" cy="15.5" r="1.2" fill="currentColor"/></svg>
          <input type="password" id="password" name="password" placeholder=" " autocomplete="current-password" required>
          <label class="float-label" for="password">Password</label>
          <button type="button" class="eye-btn" aria-label="Show password" aria-pressed="false">
            <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7a9.6 9.6 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
          </button>
        </div>
        <span class="caps-hint" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 4 13h4v7h8v-7h4z"/></svg>Caps Lock is on</span>
        <span class="field-error" id="passwordError" aria-live="polite"></span>
      </div>
      <div class="options">
        <label class="check"><input type="checkbox" id="remember" name="remember" checked>Remember me</label>
        <a href="#" id="forgotLink">Forgot password?</a>
      </div>
      <button type="submit" class="btn-submit">
        <span class="label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M10 8l4 4-4 4"/><path d="M14 12H4"/></svg>Log In</span>
        <span class="spinner" aria-hidden="true"></span>
        <svg class="done" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 10 17 19 7"/></svg>
      </button>
    </form>

    <div class="divider"><span>or</span></div>
      <div class="social-row">
        <button type="button" class="social-btn" aria-label="Google" title="Continue with Google"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M23.5 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.45a5.5 5.5 0 0 1-2.39 3.62v3h3.87c2.27-2.09 3.57-5.17 3.57-8.81z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.94-2.91l-3.87-3c-1.07.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.96H1.27v3.09A12 12 0 0 0 12 24z"/>
            <path fill="#FBBC05" d="M5.27 14.28A7.2 7.2 0 0 1 4.9 12c0-.79.14-1.56.37-2.28V6.63H1.27A12 12 0 0 0 0 12c0 1.94.46 3.77 1.27 5.37l4-3.09z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0A12 12 0 0 0 1.27 6.63l4 3.09C6.22 6.86 8.87 4.75 12 4.75z"/>
          </svg></button>
        <button type="button" class="social-btn" aria-label="Facebook" title="Coming soon"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#1877F2"/><path fill="#fff" d="M16.67 15.47 17.2 12h-3.33V9.75c0-.95.46-1.88 1.96-1.88h1.51V4.92s-1.37-.23-2.69-.23c-2.74 0-4.53 1.66-4.53 4.67V12H7.08v3.47h3.04V24h3.75v-8.53z"/></svg></button>
        <button type="button" class="social-btn" aria-label="Telegram" title="Coming soon"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path fill="#29A9EB" d="M21.5 3.5 2.6 10.8c-.9.35-.9 1.6 0 1.9l4.6 1.5 1.8 5.6c.2.7 1.1.9 1.6.4l2.5-2.4 4.7 3.5c.6.4 1.4.1 1.6-.6L22.9 4.8c.2-.8-.6-1.5-1.4-1.3z"/><path fill="#fff" opacity=".9" d="m9.2 14.2 8.6-6.4-6.7 7.3-.4 3.2z"/></svg></button>
      </div>
    <button type="button" class="demo-btn" id="demoBtn">Just looking? <strong>Try the demo account</strong></button>
    <p class="signup-text">Don't have an account?<a href="register.html">Sign Up</a></p>
  </div>
</main>

<script src="/assets/js/auth.js"></script>
<script src="/assets/js/google-login.js"></script>
<script src="/assets/js/forgot.js"></script>
<script src="/assets/js/pwa.js"></script>
</body>
</html>
