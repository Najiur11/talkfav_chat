# Runs on every push and pull request: syntax check + unit tests + API tests
# against a real PostgreSQL database (started by GitHub Actions).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: talkfav_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Syntax check
        run: |
          for f in server.js sw.js lib/*.js assets/js/*.js; do node --check "$f"; done

      - name: Tests
        env:
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/talkfav_test
        run: npm test