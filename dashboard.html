<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talkfav - Social Dashboard</title>
    <script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'light')}catch(e){}</script>
    <link rel="stylesheet" href="assets/Css/theme.css">
    <link rel="stylesheet" href="assets/Css/dashboard.css">
</head>
<body>
    <button id="theme-toggle" type="button" aria-label="Toggle dark mode">
        <span id="theme-icon">🌙</span>
    </button>

    <div class="dashboard-container">
        <header class="dashboard-header glass">
            <h1 id="welcomeUser">Welcome, User</h1>
            <button id="logoutBtn" class="btn logout-btn">Log Out</button>
        </header>

        <div class="dashboard-grid">
            <div class="sidebar-section">
                <div class="card glass">
                    <h3>My Profile</h3>
                    <p><strong>Email:</strong> <span id="userEmail"></span></p>
                    <p><strong>Country:</strong> <span id="userCountry"></span></p>
                </div>
                <div class="card glass">
                    <h3>My Friends</h3>
                    <div id="friendsList">Loading friends...</div>
                </div>
                <div class="card glass">
                    <h3>Friend Requests</h3>
                    <div id="pendingRequests">No pending requests</div>
                </div>
            </div>

            <div class="content-section">
                <div class="card glass">
                    <h3>Find People</h3>
                    <div class="search-box-wrapper">
                        <input type="text" id="searchQuery" placeholder="Search by name or email...">
                        <button id="searchBtn" class="btn btn-search">Search</button>
                    </div>
                    <div id="searchResults"></div>
                </div>

                <div id="chatSection" class="card glass" style="display: none;">
                    <h3 id="chatTitle">Chat</h3>
                    <div id="messageContainer"></div>
                    <div class="message-box">
                        <input type="text" id="messageInput" placeholder="Type a message...">
                        <button id="sendMsgBtn" class="btn btn-send">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="assets/js/script.js"></script>
    <script src="assets/js/dashboard.js"></script>
</body>
</html>
