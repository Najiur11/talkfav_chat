<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talkfav - Social Dashboard</title>
    <link rel="stylesheet" href="assets/Css/dashboard.css">
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-dashboard-header" style="display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 15px 25px; border-radius: 10px;">
            <h1 id="welcomeUser">Welcome, User</h1>
            <div>
                <button id="logoutBtn" class="logout-btn">Log Out</button>
            </div>
        </header>

        <div class="dashboard-grid" style="display: flex; gap: 20px; margin-top: 20px;">
            <div style="flex: 1;">
                <div class="card">
                    <h3>My Profile</h3>
                    <p><strong>Email:</strong> <span id="userEmail"></span></p>
                    <p><strong>Country:</strong> <span id="userCountry"></span></p>
                </div>
                <div class="card" style="margin-top: 15px;">
                    <h3>My Friends</h3>
                    <div id="friendsList">Loading friends...</div>
                </div>
                <div class="card" style="margin-top: 15px;">
                    <h3>Friend Requests</h3>
                    <div id="pendingRequests">No pending requests</div>
                </div>
            </div>

            <div style="flex: 2;">
                <div class="card">
                    <h3>Find People</h3>
                    <input type="text" id="searchQuery" placeholder="Search by name or email..." style="width: 70%; padding: 8px;">
                    <button id="searchBtn" style="padding: 8px 12px;">Search</button>
                    <div id="searchResults" style="margin-top: 10px;"></div>
                </div>

                <div id="chatSection" class="card" style="margin-top: 15px; display: none;">
                    <h3 id="chatTitle">Chat</h3>
                    <div id="messageContainer" style="height: 250px; overflow-y: scroll; border: 1px solid #ddd; padding: 10px; background: #fafafa;"></div>
                    <div style="margin-top: 10px; display: flex; gap: 10px;">
                        <input type="text" id="messageInput" placeholder="Type a message..." style="flex: 1; padding: 8px;">
                        <button id="sendMsgBtn" style="padding: 8px 15px;">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="assets/js/dashboard.js"></script>
</body>
</html>
